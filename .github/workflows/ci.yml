name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
        contents: write

    steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-node@v3
          with:
            node-version: 24
        - run: npm install
        - run: npm run build
        - run: npm run deploy
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}